<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Корзина - Azamat Market</title>
    <style>
        body { font-family: sans-serif; background: #eee; padding: 20px; }
        .cart-container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .cart-item { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #ddd; padding: 10px 0; }
        .cart-item img { width: 60px; height: 60px; object-fit: contain; border-radius: 5px; }
        .btn-delete { background: #ff7675; color: white; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
        .total { text-align: right; margin-top: 20px; font-size: 20px; font-weight: bold; }
        .btn-back { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #3498db; font-weight: bold; }
    </style>
</head>
<body>

<div class="cart-container">
    <a href="index.html" class="btn-back">← Вернуться в магазин</a>
    <h2>Ваша корзина</h2>
    <div id="cartList">Загрузка товаров из облака...</div>
    <div class="total" id="totalPrice">Итого: 0 сум</div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAtMUKrBPOQ3bwkyK5SwAhWLRGSFKH-ajU",
        authDomain: "azamat-market-a9eba.firebaseapp.com",
        databaseURL: "https://azamat-market-a9eba-default-rtdb.firebaseio.com/",
        projectId: "azamat-market-a9eba",
        storageBucket: "azamat-market-a9eba.firebasestorage.app",
        messagingSenderId: "279981697073",
        appId: "1:279981697073:web:e841afeebb43b67ba00d10"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    window.onload = function() {
        const user = JSON.parse(localStorage.getItem('currentUser'));
        const cartList = document.getElementById('cartList');
        const totalPrice = document.getElementById('totalPrice');

        if (!user) {
            cartList.innerHTML = "<h3>Пожалуйста, войдите в аккаунт!</h3>";
            return;
        }

        // Подключаемся к папке корзины именно этого пользователя
        db.ref('carts/' + user.login).on('value', (snapshot) => {
            const data = snapshot.val();
            cartList.innerHTML = "";
            let total = 0;

            if (!data) {
                cartList.innerHTML = "<p>Корзина пока пуста.</p>";
                totalPrice.innerText = "Итого: 0 сум";
                return;
            }

            Object.keys(data).forEach(id => {
                const item = data[id];
                total += parseInt(item.price);

                let itemDiv = document.createElement('div');
                itemDiv.className = 'cart-item';
                itemDiv.innerHTML = `
                    <div style="display:flex; align-items:center; gap:15px;">
                        <img src="${item.image}">
                        <div>
                            <div style="font-weight:bold;">${item.name}</div>
                            <div style="color:#27ae60;">${item.price} сум</div>
                        </div>
                    </div>
                    <button class="btn-delete" onclick="removeItem('${id}')">Удалить</button>
                `;
                cartList.appendChild(itemDiv);
            });

            totalPrice.innerText = "Итого: " + total + " сум";
        });
    };

    function removeItem(itemId) {
        const user = JSON.parse(localStorage.getItem('currentUser'));
        if (confirm("Удалить товар из корзины?")) {
            db.ref('carts/' + user.login).child(itemId).remove();
        }
    }
</script>

</body>
</html>
