<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Админка Azamat Market (Cloud)</title>
    <style>
        body { font-family: sans-serif; background: #2c3e50; color: white; padding: 20px; }
        .card { background: #34495e; padding: 20px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        button { cursor: pointer; padding: 10px 15px; border: none; border-radius: 5px; color: white; font-weight: bold; }
        .btn-approve { background: #27ae60; margin-right: 10px; }
        .btn-delete { background: #e74c3c; }
        .key-display { background: #f1c40f; color: #000; padding: 5px; border-radius: 3px; font-family: monospace; }
        h1 { border-bottom: 2px solid #f1c40f; padding-bottom: 10px; }
    </style>
</head>
<body>

<h1>Панель управления (Cloud)</h1>

<h3>Новые заявки:</h3>
<div id="requestsList">Загрузка...</div>

<hr>

<h3>Одобренные продавцы:</h3>
<div id="sellersList">Загрузка...</div>

<!-- ПОДКЛЮЧЕНИЕ FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAtMUKrBPOQ3bwkyK5SwAhWLRGSFKH-ajU",
        authDomain: "azamat-market-a9eba.firebaseapp.com",
        databaseURL: "https://azamat-market-a9eba-default-rtdb.firebaseio.com/",
        projectId: "azamat-market-a9eba",
        storageBucket: "azamat-market-a9eba.firebasestorage.app",
        messagingSenderId: "279981697073",
        appId: "1:279981697073:web:e841afeebb43b67ba00d10"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 1. Слушаем новые заявки
    db.ref('requests').on('value', (snapshot) => {
        const list = document.getElementById('requestsList');
        list.innerHTML = "";
        const data = snapshot.val();

        if (!data) {
            list.innerHTML = "<p>Новых заявок нет</p>";
            return;
        }

        Object.keys(data).forEach(id => {
            let req = data[id];
            let item = document.createElement('div');
            item.className = 'card';
            item.innerHTML = `
                <div>
                    <strong>${req.name}</strong> (${req.phone})
                </div>
                <div>
                    <button class="btn-approve" onclick="approveSeller('${id}', '${req.name}', '${req.phone}')">Одобрить</button>
                    <button class="btn-delete" onclick="deleteRequest('${id}')">Удалить</button>
                </div>
            `;
            list.appendChild(item);
        });
    });

    // 2. Слушаем список одобренных
    db.ref('approvedSellers').on('value', (snapshot) => {
        const list = document.getElementById('sellersList');
        list.innerHTML = "";
        const data = snapshot.val();

        if (!data) {
            list.innerHTML = "<p>Пока нет одобренных продавцов</p>";
            return;
        }

        Object.keys(data).forEach(id => {
            let seller = data[id];
            let item = document.createElement('div');
            item.className = 'card';
            item.innerHTML = `
                <div>${seller.name} - <span class="key-display">${seller.key}</span></div>
                <button class="btn-delete" onclick="removeSeller('${id}')">Заблокировать</button>
            `;
            list.appendChild(item);
        });
    });

    // Функция одобрения
    function approveSeller(id, name, phone) {
        let sellerKey = "key-" + Math.floor(Math.random() * 1000000);
        
        // Добавляем в список продавцов
        db.ref('approvedSellers').push({
            name: name,
            phone: phone,
            key: sellerKey
        }).then(() => {
            // Удаляем из заявок
            db.ref('requests').child(id).remove();
            alert("Продавец одобрен! Ключ: " + sellerKey);
        });
    }

    function deleteRequest(id) {
        if(confirm("Удалить заявку?")) db.ref('requests').child(id).remove();
    }

    function removeSeller(id) {
        if(confirm("Заблокировать продавца? Его ключ перестанет работать.")) db.ref('approvedSellers').child(id).remove();
    }
</script>
</body>
</html>
