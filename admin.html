<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Управление товарами - Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 20px; }
        .admin-container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .product-row { display: flex; align-items: center; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; }
        .product-row img { width: 50px; height: 50px; object-fit: contain; }
        .btn-delete { background: #ff7675; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-delete:hover { background: #e84393; }
        .back-link { display: inline-block; margin-bottom: 20px; text-decoration: none; color: #3498db; }
    </style>
</head>
<body>

<div class="admin-container">
    <a href="index.html" class="back-link">← На главную</a>
    <h2>Управление товарами</h2>
    <div id="adminProductList">Загрузка товаров...</div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAtMUKrBPOQ3bwkyK5SwAhWLRGSFKH-ajU",
        authDomain: "azamat-market-a9eba.firebaseapp.com",
        databaseURL: "https://azamat-market-a9eba-default-rtdb.firebaseio.com/",
        projectId: "azamat-market-a9eba",
        storageBucket: "azamat-market-a9eba.firebasestorage.app",
        messagingSenderId: "279981697073",
        appId: "1:279981697073:web:e841afeebb43b67ba00d10"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Загружаем товары специально для удаления
    function loadAdminProducts() {
        const list = document.getElementById('adminProductList');
        
        db.ref('products').on('value', (snapshot) => {
            const data = snapshot.val();
            list.innerHTML = "";

            if (!data) {
                list.innerHTML = "<p>Товаров пока нет.</p>";
                return;
            }

            Object.keys(data).forEach(id => {
                const p = data[id];
                const row = document.createElement('div');
                row.className = 'product-row';
                row.innerHTML = `
                    <div style="display:flex; align-items:center; gap:15px;">
                        <img src="${p.img || p.image}">
                        <div>
                            <strong>${p.name}</strong><br>
                            <small>${p.price} сум</small>
                        </div>
                    </div>
                    <button class="btn-delete" onclick="deleteProduct('${id}', '${p.name}')">Удалить</button>
                `;
                list.appendChild(row);
            });
        });
    }

    // Функция самого удаления
    function deleteProduct(productId, productName) {
        if (confirm("Вы уверены, что хотите удалить товар '" + productName + "'?")) {
            db.ref('products/' + productId).remove()
                .then(() => {
                    alert("Товар удален!");
                })
                .catch((error) => {
                    alert("Ошибка при удалении: " + error.message);
                });
        }
    }

    window.onload = loadAdminProducts;
</script>

</body>
</html>
