<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>🔒 Вход в систему</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* Стили только для экрана входа */
        body { font-family: sans-serif; background: #1a1a1a; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: white; }
        .lock-box { background: #222; padding: 40px; border-radius: 20px; text-align: center; box-shadow: 0 15px-35px rgba(0,0,0,0.7); width: 320px; border: 1px solid #333; }
        input { width: 100%; padding: 15px; margin: 20px 0; border: 2px solid #444; border-radius: 12px; background: #333; color: white; font-size: 18px; text-align: center; outline: none; }
        input:focus { border-color: #9b59b6; }
        button { width: 100%; padding: 15px; background: #9b59b6; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px; }
        
        /* Стили для панели управления (появятся потом) */
        .admin-main { background: #f4f4f4; width: 100%; min-height: 100vh; padding: 20px; color: #333; }
        .product-row { display: flex; align-items: center; justify-content: space-between; padding: 15px; background: white; margin-bottom: 10px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    </style>
</head>
<body id="mainBody">

<div id="authArea" class="lock-box">
    <h1 style="margin:0; font-size: 24px;">Azamat Market</h1>
    <p style="color: #888; margin-top: 10px;">Панель управления</p>
    <input type="password" id="passCode" placeholder="••••••••">
    <button onclick="unlock()">Войти в систему</button>
    <p id="warn" style="color: #ff7675; display: none; margin-top: 15px; font-size: 14px;">Доступ ограничен!</p>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
    // Твои настройки Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyAtMUKrBPOQ3bwkyK5SwAhWLRGSFKH-ajU",
        authDomain: "azamat-market-a9eba.firebaseapp.com",
        databaseURL: "https://azamat-market-a9eba-default-rtdb.firebaseio.com/",
        projectId: "azamat-market-a9eba",
        storageBucket: "azamat-market-a9eba.firebasestorage.app",
        messagingSenderId: "279981697073",
        appId: "1:279981697073:web:e841afeebb43b67ba00d10"
    };

    function unlock() {
        const val = document.getElementById('passCode').value;
        if (val === "azamat2026") {
            // Полностью переписываем тело страницы
            document.getElementById('mainBody').style.background = "#f4f4f4";
            document.getElementById('mainBody').style.display = "block";
            document.getElementById('mainBody').innerHTML = `
                <div class="admin-main">
                    <div style="max-width: 800px; margin: 0 auto;">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <h2>📦 Список всех товаров</h2>
                            <button onclick="location.reload()" style="background:#ddd; border:none; padding:10px 15px; border-radius:8px; cursor:pointer; color:#333;">Выйти</button>
                        </div>
                        <hr style="border:0; border-top:1px solid #ddd; margin: 20px 0;">
                        <div id="productList">Загрузка товаров из базы данных...</div>
                    </div>
                </div>
            `;
            startFirebase();
        } else {
            document.getElementById('warn').style.display = 'block';
        }
    }

    function startFirebase() {
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();
        
        db.ref('products').on('value', (snapshot) => {
            const data = snapshot.val();
            const list = document.getElementById('productList');
            list.innerHTML = "";
            if (!data) { list.innerHTML = "<h3>Товаров нет</h3>"; return; }

            Object.keys(data).forEach(id => {
                const p = data[id];
                const div = document.createElement('div');
                div.className = 'product-row';
                div.innerHTML = `
                    <div style="display:flex; align-items:center; gap:15px;">
                        <img src="${p.img || p.image}" style="width:50px; height:50px; object-fit:contain;">
                        <div>
                            <strong>${p.name}</strong><br>
                            <span style="font-size:13px; color:#888;">${p.price} сум</span>
                        </div>
                    </div>
                    <button onclick="del('${id}', '${p.name}')" style="background:#ff7675; color:white; border:none; padding:8px 15px; border-radius:8px; cursor:pointer;">Удалить</button>
                `;
                list.appendChild(div);
            });
        });
    }

    function del(id, name) {
        if (confirm("Удалить '" + name + "'?")) {
            firebase.database().ref('products/' + id).remove();
        }
    }
</script>
</body>
</html>
