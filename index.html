<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Azamat Market - Global</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; background: #eee; margin: 0; padding: 0; padding-bottom: 80px; }
        
        /* Верхняя панель */
        header { 
            background: #2c3e50; color: #fff; padding: 15px 20px; 
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 10; 
        }

        /* Контейнер товаров */
        .container { display: flex; flex-wrap: wrap; gap: 15px; padding: 15px; justify-content: center; }
        
        .product { background: #fff; padding: 10px; width: 160px; border-radius: 12px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .product img { width: 100%; height: 120px; object-fit: contain; border-radius: 8px; }
        .product h3 { font-size: 14px; margin: 10px 0 5px; height: 35px; overflow: hidden; color: #333; }
        .product p { color: #27ae60; font-weight: bold; margin: 5px 0; }
        
        button { cursor: pointer; border: none; border-radius: 8px; font-weight: bold; transition: 0.3s; }
        .btn-buy { background: #27ae60; color: white; width: 100%; padding: 10px; margin-top: 5px; }
        .btn-buy:hover { background: #219150; }

        /* НИЖНЯЯ ПАНЕЛЬ */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: white; display: flex; justify-content: space-around;
            padding: 12px 0; border-top: 1px solid #ddd; z-index: 100;
        }
        .nav-item {
            text-align: center; text-decoration: none; color: #7f8c8d; font-size: 12px;
            display: flex; flex-direction: column; align-items: center; gap: 4px;
        }
        .nav-item.active { color: #9b59b6; } /* Фиолетовый цвет для активной вкладки */
        .nav-icon { font-size: 22px; }

        footer { text-align: center; color: #888; font-size: 11px; padding: 20px 0 100px; }
    </style>
</head>
<body>

<header>
    <div style="display: flex; align-items: center;">
        <strong style="font-size: 20px; margin-right: 15px;">AZAMAT MARKET</strong>
        <a href="about.html" style="color: #bdc3c7; text-decoration: none; font-size: 13px;">О нас</a>
    </div>
</header>

<!-- Витрина товаров -->
<div class="container" id="box">
    <h2 style="color:#bbb; width:100%; text-align:center; font-weight: normal; margin-top: 50px;">
        Загрузка товаров из облака...
    </h2>
</div>

<footer>
    <p>© 2026 Azamat Market. Global Cloud Version.</p>
    <a href="admin.html" style="color:#ccc; text-decoration:none;">Админ-панель</a>
</footer>

<!-- НИЖНЯЯ ПАНЕЛЬ -->
<div class="bottom-nav">
    <a href="index.html" class="nav-item active">
        <span class="nav-icon">🏠</span>
        <span>Главная</span>
    </a>
    <a href="cart.html" class="nav-item">
        <span class="nav-icon">🛒</span>
        <span>Корзина</span>
    </a>
    <a href="profile.html" class="nav-item">
        <span class="nav-icon">👤</span>
        <span>Вы</span>
    </a>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
    // ТВОИ КЛЮЧИ FIREBASE
    const firebaseConfig = {
        apiKey: "AIzaSyAtMUKrBPOQ3bwkyK5SwAhWLRGSFKH-ajU",
        authDomain: "azamat-market-a9eba.firebaseapp.com",
        databaseURL: "https://azamat-market-a9eba-default-rtdb.firebaseio.com/",
        projectId: "azamat-market-a9eba",
        storageBucket: "azamat-market-a9eba.firebasestorage.app",
        messagingSenderId: "279981697073",
        appId: "1:279981697073:web:e841afeebb43b67ba00d10"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Загрузка товаров
    function loadProducts() {
        const box = document.getElementById('box');
        
        db.ref('products').on('value', (snapshot) => {
            const data = snapshot.val();
            box.innerHTML = ""; 

            if (!data) {
                box.innerHTML = "<h2 style='color:#bbb; width:100%; text-align:center;'>На складе пока пусто.</h2>";
                return;
            }

            Object.keys(data).forEach(id => {
                const p = data[id];
                const imgSource = p.img || p.image; 
                
                let card = document.createElement('div');
                card.className = 'product';
                card.innerHTML = `
                    <img src="${imgSource}">
                    <h3>${p.name}</h3>
                    <p>${p.price} сум</p>
                    <button class="btn-buy" onclick="addToCart('${id}', '${p.name}', '${p.price}', '${imgSource}')">
                        Купить
                    </button>
                `;
                box.appendChild(card);
            });
        });
    }

    // Добавление в облачную корзину
    function addToCart(productId, name, price, image) {
        const user = JSON.parse(localStorage.getItem('currentUser'));

        if (!user) {
            alert("Пожалуйста, войдите в аккаунт, чтобы покупать товары!");
            window.location.href = 'auth.html';
            return;
        }

        db.ref('carts/' + user.login).push({
            productId: productId,
            name: name,
            price: price,
            image: image,
            date: Date.now()
        }).then(() => {
            alert("Товар добавлен в корзину!");
        });
    }

    // Запуск при открытии
    window.onload = function() {
        loadProducts();
    };
</script>

</body>
</html>
