<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Azamat Market - Global</title>
    <style>
        body { font-family: sans-serif; background: #eee; margin: 0; padding: 0; padding-bottom: 70px; } /* Отступ снизу для панели */
        
        /* Верхняя панель */
        header { 
            background: #2c3e50; color: #fff; padding: 15px 20px; 
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 10; 
        }

        /* Контейнер товаров */
        .container { display: flex; flex-wrap: wrap; gap: 15px; padding: 15px; justify-content: center; }
        
        .product { background: #fff; padding: 10px; width: 160px; border-radius: 12px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .product img { width: 100%; height: 120px; object-fit: contain; border-radius: 8px; }
        .product h3 { font-size: 14px; margin: 10px 0 5px; height: 35px; overflow: hidden; }
        
        button { cursor: pointer; border: none; border-radius: 8px; font-weight: bold; }
        .btn-buy { background: #27ae60; color: white; width: 100%; padding: 8px; margin-top: 5px; }

        /* НИЖНЯЯ ПАНЕЛЬ (как в Uzum) */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: white; display: flex; justify-content: space-around;
            padding: 10px 0; border-top: 1px solid #ddd; z-index: 100;
        }
        .nav-item {
            text-align: center; text-decoration: none; color: #7f8c8d; font-size: 12px;
            display: flex; flex-direction: column; align-items: center; gap: 4px;
        }
        .nav-item.active { color: #9b59b6; } /* Фиолетовый активный цвет */
        .nav-icon { font-size: 20px; }

        /* Стиль для кнопки "Вы" (всплывающее меню) */
        #userMenu {
            display: none; position: fixed; bottom: 70px; right: 20px;
            background: white; box-shadow: 0 -2px 15px rgba(0,0,0,0.2);
            border-radius: 15px; padding: 15px; width: 200px; z-index: 101;
        }
    </style>
</head>
<body>

<header>
    <strong style="font-size: 20px;">AZAMAT MARKET</strong>
    <a href="about.html" style="color: #bdc3c7; text-decoration: none; font-size: 14px;">О нас</a>
</header>

<div class="container" id="box">
    <h2 style="color:#bbb; width:100%; text-align:center;">Загрузка товаров...</h2>
</div>

<div id="userMenu">
    <div id="userInfo" style="margin-bottom: 10px; font-weight: bold; color: #2c3e50;">Гость</div>
    <hr>
    <a href="seller-request.html" style="display: block; padding: 10px 0; color: #9b59b6; text-decoration: none; font-weight: bold;">Стать продавцом</a>
    <div id="authAction">
        <a href="auth.html" style="display: block; padding: 10px 0; color: #3498db; text-decoration: none;">Войти</a>
    </div>
</div>

<div class="bottom-nav">
    <a href="index.html" class="nav-item active">
        <span class="nav-icon">🏠</span>
        <span>Главная</span>
    </a>
    <a href="cart.html" class="nav-item">
        <span class="nav-icon">🛒</span>
        <span>Корзина</span>
    </a>
    <div class="nav-item" onclick="toggleUserMenu()" style="cursor:pointer;">
        <span class="nav-icon">👤</span>
        <span>Вы</span>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAtMUKrBPOQ3bwkyK5SwAhWLRGSFKH-ajU",
        authDomain: "azamat-market-a9eba.firebaseapp.com",
        databaseURL: "https://azamat-market-a9eba-default-rtdb.firebaseio.com/",
        projectId: "azamat-market-a9eba",
        storageBucket: "azamat-market-a9eba.firebasestorage.app",
        messagingSenderId: "279981697073",
        appId: "1:279981697073:web:e841afeebb43b67ba00d10"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Функция открытия меню "Вы"
    function toggleUserMenu() {
        const menu = document.getElementById('userMenu');
        menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
    }

    function loadProducts() {
        const box = document.getElementById('box');
        db.ref('products').on('value', (snapshot) => {
            const data = snapshot.val();
            box.innerHTML = "";
            if (!data) {
                box.innerHTML = "<h2>Пусто</h2>";
                return;
            }
            Object.keys(data).forEach(id => {
                const p = data[id];
                let card = document.createElement('div');
                card.className = 'product';
                card.innerHTML = `
                    <img src="${p.img || p.image}">
                    <h3>${p.name}</h3>
                    <p><strong>${p.price} сум</strong></p>
                    <button class="btn-buy" onclick="addToCart('${id}', '${p.name}', '${p.price}', '${p.img || p.image}')">Купить</button>
                `;
                box.appendChild(card);
            });
        });
    }

    function addToCart(productId, name, price, image) {
        const user = JSON.parse(localStorage.getItem('currentUser'));
        if (!user) { alert("Войдите в аккаунт!"); window.location.href='auth.html'; return; }
        db.ref('carts/' + user.login).push({ productId, name, price, image, date: Date.now() });
        alert("Добавлено в корзину!");
    }

    window.onload = function() {
        const user = JSON.parse(localStorage.getItem('currentUser'));
        if (user) {
            document.getElementById('userInfo').innerText = "👋 " + user.login;
            document.getElementById('authAction').innerHTML = `<button onclick="logout()" style="background:none; border:none; color:#ff7675; padding:10px 0; cursor:pointer; font-weight:bold;">Выйти</button>`;
        }
        loadProducts();
    };

    function logout() {
        localStorage.removeItem('currentUser');
        location.reload();
    }
</script>
</body>
</html>
