<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Azamat Market - Global</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; background: #eee; margin: 0; padding: 0; padding-bottom: 80px; }
        header { background: #2c3e50; color: #fff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
        
        /* Лента категорий */
        .categories { display: flex; overflow-x: auto; padding: 10px; gap: 10px; background: white; white-space: nowrap; position: sticky; top: 55px; z-index: 9; border-bottom: 1px solid #ddd; }
        .categories::-webkit-scrollbar { display: none; }
        .cat-btn { background: #f1f2f6; border: none; padding: 8px 18px; border-radius: 20px; cursor: pointer; font-weight: bold; color: #57606f; transition: 0.3s; outline: none; }
        .cat-btn.active { background: #9b59b6; color: white; }

        .container { display: flex; flex-wrap: wrap; gap: 15px; padding: 15px; justify-content: center; }
        
        /* Карточка товара */
        .product { background: #fff; padding: 10px; width: 160px; border-radius: 12px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: space-between; }
        .product-info { cursor: pointer; } /* Область для клика */
        .product img { width: 100%; height: 120px; object-fit: contain; border-radius: 8px; }
        .product h3 { font-size: 14px; margin: 10px 0 5px; height: 35px; overflow: hidden; color: #333; text-align: left; line-height: 1.2; }
        .product .price { color: #27ae60; font-weight: bold; margin: 5px 0; text-align: left; font-size: 15px; }
        
        .btn-buy { background: #27ae60; color: white; width: 100%; padding: 10px; margin-top: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-buy:active { transform: scale(0.95); }

        /* Нижняя панель */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #ddd; z-index: 100; }
        .nav-item { text-align: center; text-decoration: none; color: #7f8c8d; font-size: 12px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .nav-item.active { color: #9b59b6; }
        .nav-icon { font-size: 22px; }
    </style>
</head>
<body>

<header>
    <div style="display: flex; align-items: center;">
        <strong style="font-size: 20px; margin-right: 15px;">AZAMAT MARKET</strong>
        <a href="about.html" style="color: #bdc3c7; text-decoration: none; font-size: 13px;">О нас</a>
    </div>
</header>

<div class="categories" id="catBar">
    <button class="cat-btn active" onclick="filterCategory('Все', this)">Все</button>
    <button class="cat-btn" onclick="filterCategory('Электроника', this)">Электроника</button>
    <button class="cat-btn" onclick="filterCategory('Одежда', this)">Одежда</button>
    <button class="cat-btn" onclick="filterCategory('Дом', this)">Дом</button>
    <button class="cat-btn" onclick="filterCategory('Аксессуары', this)">Аксессуары</button>
    <button class="cat-btn" onclick="filterCategory('Другое', this)">Другое</button>
</div>

<div class="container" id="box">
    <h2 style="color:#bbb; width:100%; text-align:center; font-weight: normal; margin-top: 50px;">Загрузка товаров...</h2>
</div>

<div class="bottom-nav">
    <a href="index.html" class="nav-item active"><span class="nav-icon">🏠</span><span>Главная</span></a>
    <a href="cart.html" class="nav-item"><span class="nav-icon">🛒</span><span>Корзина</span></a>
    <a href="profile.html" class="nav-item"><span class="nav-icon">👤</span><span>Вы</span></a>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAtMUKrBPOQ3bwkyK5SwAhWLRGSFKH-ajU",
        authDomain: "azamat-market-a9eba.firebaseapp.com",
        databaseURL: "https://azamat-market-a9eba-default-rtdb.firebaseio.com/",
        projectId: "azamat-market-a9eba",
        storageBucket: "azamat-market-a9eba.firebasestorage.app",
        messagingSenderId: "279981697073",
        appId: "1:279981697073:web:e841afeebb43b67ba00d10"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let allProducts = {};

    function filterCategory(catName, btn) {
        document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const box = document.getElementById('box');
        box.innerHTML = "";

        Object.keys(allProducts).forEach(id => {
            const p = allProducts[id];
            if (catName === 'Все' || p.category === catName) {
                let card = document.createElement('div');
                card.className = 'product';
                card.innerHTML = `
                    <div class="product-info" onclick="window.location.href='product-details.html?id=${id}'">
                        <img src="${p.img || p.image}">
                        <h3>${p.name}</h3>
                        <div class="price">${p.price} сум</div>
                    </div>
                    <button class="btn-buy" onclick="addToCart('${id}', '${p.name}', '${p.price}', '${p.img || p.image}')">
                        Купить
                    </button>
                `;
                box.appendChild(card);
            }
        });
    }

    function loadProducts() {
        db.ref('products').on('value', (snapshot) => {
            allProducts = snapshot.val() || {};
            const activeBtn = document.querySelector('.cat-btn.active');
            filterCategory(activeBtn.innerText, activeBtn);
        });
    }

    function addToCart(productId, name, price, image) {
        const user = JSON.parse(localStorage.getItem('currentUser'));
        if (!user) { alert("Войдите в аккаунт!"); window.location.href = 'auth.html'; return; }
        
        db.ref('carts/' + user.login).push({
            productId: productId,
            name: name,
            price: price,
            image: image,
            date: Date.now()
        }).then(() => {
            alert("Товар добавлен в корзину!");
        });
    }

    window.onload = loadProducts;
</script>
</body>
</html>
