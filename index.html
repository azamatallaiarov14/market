<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Azamat Market - Global</title>
    <style>
        body { font-family: sans-serif; background: #eee; margin: 0; padding: 20px; }
        header { background: #2c3e50; color: #fff; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
        .container { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px; justify-content: center; }
        .product { background: #fff; padding: 15px; width: 220px; border-radius: 10px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .product img { width: 100%; height: 150px; object-fit: contain; border-radius: 5px; }
        button { cursor: pointer; padding: 10px; border: none; border-radius: 5px; color: white; font-weight: bold; }
        .btn-buy { background: #27ae60; width: 100%; margin-top: 10px; transition: 0.3s; }
        .btn-buy:hover { background: #219150; }
        footer { margin-top: 50px; text-align: center; color: #888; font-size: 12px; padding-bottom: 20px; }
    </style>
</head>
<body>

<header>
    <!-- Левая часть: Название и О нас -->
    <div style="display: flex; align-items: center;">
        <strong style="font-size: 20px; margin-right: 20px;">AZAMAT MARKET</strong>
        <a href="about.html" style="color: #bdc3c7; text-decoration: none; font-size: 14px;">О нас</a>
    </div>
    
    <!-- Правая часть: Стать продавцом, Приветствие и Корзина -->
    <div style="display: flex; align-items: center;">
        <a href="seller-request.html" style="background: #9b59b6; color: white; padding: 8px 15px; border-radius: 8px; text-decoration: none; font-weight: bold; margin-right: 20px; transition: 0.3s;" onmouseover="this.style.background='#8e44ad'" onmouseout="this.style.background='#9b59b6'">
            Стать продавцом
        </a>

        <div id="userSection" style="display: flex; align-items: center;">
            <a href="auth.html" style="color: white; text-decoration: none; margin-right: 15px;">Войти</a>
            <a href="cart.html" style="background: #f1c40f; color: black; padding: 8px 15px; border-radius: 8px; text-decoration: none; font-weight: bold;">🛒 Корзина</a>
        </div>
    </div>
</header>

<div class="container" id="box">
    <h2 style="color:#bbb; width:100%; text-align:center;">Загрузка товаров из облака...</h2>
</div>

<footer>
    <p>© 2026 Azamat Market. Global Cloud Version.</p>
    <a href="admin.html" style="color:#ccc; text-decoration:none;">Админ-панель</a>
</footer>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
    // ТВОИ КЛЮЧИ
    const firebaseConfig = {
        apiKey: "AIzaSyAtMUKrBPOQ3bwkyK5SwAhWLRGSFKH-ajU",
        authDomain: "azamat-market-a9eba.firebaseapp.com",
        databaseURL: "https://azamat-market-a9eba-default-rtdb.firebaseio.com/",
        projectId: "azamat-market-a9eba",
        storageBucket: "azamat-market-a9eba.firebasestorage.app",
        messagingSenderId: "279981697073",
        appId: "1:279981697073:web:e841afeebb43b67ba00d10"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 1. ФУНКЦИЯ ЗАГРУЗКИ ТОВАРОВ
    function loadProducts() {
        const box = document.getElementById('box');
        
        db.ref('products').on('value', (snapshot) => {
            const data = snapshot.val();
            box.innerHTML = ""; // Очищаем надпись "Загрузка"

            if (!data) {
                box.innerHTML = "<h2 style='color:#bbb; width:100%; text-align:center;'>На складе пусто. Ждем продавцов!</h2>";
                return;
            }

            Object.keys(data).forEach(id => {
                const p = data[id];
                // Проверяем, как называются поля в твоей базе: img или image
                let imgSource = p.img || p.image; 
                
                let card = document.createElement('div');
                card.className = 'product';
                card.innerHTML = `
                    <img src="${imgSource}">
                    <h3>${p.name}</h3>
                    <p><strong>${p.price} сум</strong></p>
                    <button class="btn-buy" onclick="addToCart('${id}', '${p.name}', '${p.price}', '${imgSource}')">Купить</button>
                `;
                box.appendChild(card);
            });
        });
    }

    // 2. ФУНКЦИЯ ДОБАВЛЕНИЯ В КОРЗИНУ
    function addToCart(productId, name, price, image) {
        const user = JSON.parse(localStorage.getItem('currentUser'));

        if (!user) {
            alert("Пожалуйста, войдите в аккаунт, чтобы добавлять товары в корзину!");
            window.location.href = 'auth.html';
            return;
        }

        db.ref('carts/' + user.login).push({
            productId: productId,
            name: name,
            price: price,
            image: image,
            date: Date.now()
        }).then(() => {
            alert("Товар " + name + " добавлен в вашу облачную корзину!");
        });
    }

    // 3. ФУНКЦИЯ ВЫХОДА
    function logout() {
        localStorage.removeItem('currentUser');
        location.reload();
    }

    // 4. ЗАПУСК ПРИ ЗАГРУЗКЕ СТРАНИЦЫ
    window.onload = function() {
        const user = JSON.parse(localStorage.getItem('currentUser'));
        const section = document.getElementById('userSection');
        
        if (user) {
            section.innerHTML = `
                <span style="margin-right:15px;">👋 Привет, <b>${user.login}</b></span>
                <a href="cart.html" style="background: #f1c40f; color: black; padding: 8px 15px; border-radius: 8px; text-decoration: none; font-weight: bold;">🛒 Корзина</a>
                <button onclick="logout()" style="background:none; border:none; color:#ff7675; cursor:pointer; margin-left:10px;">Выйти</button>
            `;
        }

        loadProducts(); // Запускаем загрузку товаров
    };
</script>
</body>
</html>
