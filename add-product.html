<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Добавить товар - Azamat Market</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 20px; }
        .form-card { background: white; max-width: 400px; margin: 0 auto; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #27ae60; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="form-card">
    <h2>Новый товар</h2>
    <input type="text" id="pName" placeholder="Название товара">
    <input type="number" id="pPrice" placeholder="Цена (сум)">
    <input type="text" id="pImg" placeholder="Ссылка на фото товара">
    
    <label style="font-size: 14px; color: #666;">Категория:</label>
    <select id="pCategory">
        <option value="Другое">Другое</option>
        <option value="Электроника">Электроника</option>
        <option value="Одежда">Одежда</option>
        <option value="Дом">Дом</option>
    </select>

    <button onclick="saveProduct()">Опубликовать на витрину</button>
    <br><br>
    <a href="admin.html" style="display:block; text-align:center; color:#7f8c8d; text-decoration:none;">Назад</a>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAtMUKrBPOQ3bwkyK5SwAhWLRGSFKH-ajU",
        authDomain: "azamat-market-a9eba.firebaseapp.com",
        databaseURL: "https://azamat-market-a9eba-default-rtdb.firebaseio.com/",
        projectId: "azamat-market-a9eba",
        storageBucket: "azamat-market-a9eba.firebasestorage.app",
        messagingSenderId: "279981697073",
        appId: "1:279981697073:web:e841afeebb43b67ba00d10"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function saveProduct() {
        const name = document.getElementById('pName').value;
        const price = document.getElementById('pPrice').value;
        const img = document.getElementById('pImg').value;
        const category = document.getElementById('pCategory').value;

        if(!name || !price || !img) { alert("Заполните все поля!"); return; }

        db.ref('products').push({
            name: name,
            price: price,
            img: img,
            category: category
        }).then(() => {
            alert("Товар добавлен!");
            window.location.href = 'index.html';
        });
    }
</script>
</body>
</html>
