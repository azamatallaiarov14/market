<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Добавить товар - Azamat Market</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; background: #f4f4f4; margin: 0; padding: 20px; }
        .form-card { background: white; max-width: 450px; margin: 0 auto; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        
        label { display: block; margin-top: 15px; margin-bottom: 5px; font-size: 14px; color: #666; font-weight: bold; }
        input, select, textarea { 
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; 
            box-sizing: border-box; font-size: 16px; outline: none; transition: 0.3s;
        }
        input:focus, select:focus, textarea:focus { border-color: #3498db; box-shadow: 0 0 5px rgba(52, 152, 219, 0.3); }
        
        textarea { height: 120px; resize: none; font-family: sans-serif; }
        
        button { 
            width: 100%; padding: 15px; background: #27ae60; color: white; border: none; 
            border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 25px; font-size: 16px;
        }
        button:hover { background: #219150; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #7f8c8d; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>

<div class="form-card">
    <h2>Новый товар</h2>
    
    <label>Название товара</label>
    <input type="text" id="pName" placeholder="Например: iPhone 15 Pro">
    
    <label>Цена (в сумах)</label>
    <input type="number" id="pPrice" placeholder="Например: 12000000">
    
    <label>Ссылка на изображение</label>
    <input type="text" id="pImg" placeholder="Вставьте ссылку на картинку">
    
    <label>Категория</label>
    <select id="pCategory">
        <option value="Другое">Выберите категорию</option>
        <option value="Электроника">Электроника</option>
        <option value="Одежда">Одежда</option>
        <option value="Дом">Дом</option>
        <option value="Аксессуары">Аксессуары</option>
    </select>
    
    <label>Описание товара</label>
    <textarea id="pDesc" placeholder="Расскажите о товаре подробно (характеристики, состояние, функции)..."></textarea>

    <button onclick="saveProduct()">Опубликовать на витрину</button>
    <a href="admin.html" class="back-link">← Вернуться в админку</a>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAtMUKrBPOQ3bwkyK5SwAhWLRGSFKH-ajU",
        authDomain: "azamat-market-a9eba.firebaseapp.com",
        databaseURL: "https://azamat-market-a9eba-default-rtdb.firebaseio.com/",
        projectId: "azamat-market-a9eba",
        storageBucket: "azamat-market-a9eba.firebasestorage.app",
        messagingSenderId: "279981697073",
        appId: "1:279981697073:web:e841afeebb43b67ba00d10"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function saveProduct() {
        const name = document.getElementById('pName').value;
        const price = document.getElementById('pPrice').value;
        const img = document.getElementById('pImg').value;
        const category = document.getElementById('pCategory').value;
        const description = document.getElementById('pDesc').value;

        // Простая проверка полей
        if(!name || !price || !img || !description) { 
            alert("Пожалуйста, заполните все поля, включая описание!"); 
            return; 
        }

        // Сохраняем расширенный объект товара
        db.ref('products').push({
            name: name,
            price: price,
            img: img,
            category: category,
            description: description,
            dateAdded: Date.now()
        }).then(() => {
            alert("Товар успешно добавлен!");
            window.location.href = 'index.html'; // Возвращаемся на главную
        }).catch((error) => {
            console.error("Ошибка при сохранении:", error);
            alert("Произошла ошибка. Проверьте консоль.");
        });
    }
</script>

</body>
</html>
