<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Заявка на продавца - Azamat Market</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .form-card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 350px; }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 14px; border: none; border-radius: 8px; color: white; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; }
        .btn-send { background: #9b59b6; margin-top: 10px; }
        .btn-send:hover { background: #8e44ad; }
        .btn-back { background: #7f8c8d; margin-top: 10px; }
    </style>
</head>
<body>

<div class="form-card">
    <h2>Стать продавцом</h2>
    <p style="font-size: 14px; color: #666; text-align: center;">Оставьте заявку, и администрация свяжется с вами.</p>
    
    <input type="text" id="surname" placeholder="Фамилия">
    <input type="text" id="name" placeholder="Имя">
    <input type="text" id="phone" placeholder="+998 (__) ___ __ __">
    
    <button class="btn-send" onclick="sendRequest()">Отправить заявку</button>
    <button class="btn-back" onclick="window.location.href='index.html'">Назад</button>
</div>

<!-- ПОДКЛЮЧЕНИЕ FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

<script>
    // ТВОИ КЛЮЧИ (ОБЯЗАТЕЛЬНО ДОЛЖНЫ БЫТЬ ТУТ)
    const firebaseConfig = {
        apiKey: "AIzaSyAtMUKrBPOQ3bwkyK5SwAhWLRGSFKH-ajU",
        authDomain: "azamat-market-a9eba.firebaseapp.com",
        databaseURL: "https://azamat-market-a9eba-default-rtdb.firebaseio.com/",
        projectId: "azamat-market-a9eba",
        storageBucket: "azamat-market-a9eba.firebasestorage.app",
        messagingSenderId: "279981697073",
        appId: "1:279981697073:web:e841afeebb43b67ba00d10"
    };

    // Инициализация базы данных
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    function sendRequest() {
        let name = document.getElementById('name').value;
        let surname = document.getElementById('surname').value;
        let phone = document.getElementById('phone').value;

        if(name == "" || phone == "") { 
            alert("Пожалуйста, заполните Имя и Телефон!"); 
            return; 
        }

        // Отправляем заявку в облако Google
        db.ref('requests').push({
            name: name + " " + surname,
            phone: phone,
            status: "waiting",
            timestamp: Date.now()
        }).then(() => {
            alert("Заявка успешно отправлена! Ждите одобрения Азамата.");
            window.location.href = 'index.html';
        }).catch((error) => {
            alert("Ошибка Firebase: " + error.message);
        });
    }
</script>

</body>
</html>
